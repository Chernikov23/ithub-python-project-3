[project]
name = "ithub-python-project-indreams"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lex Trofimov", email = "daslef93@gmail.com" }]
dependencies = [
    "faker>=40.15.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "pytest>=9.0.3",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = ["mypy<2.0.0,>=1.11.0", "pytest>=9.0.0", "ruff<1.0.0,>=0.8.0"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest]


[tool.ruff]
target-version = "py313"
line-length = 100
fix = true
format.quote-style = "single"
format.indent-style = "tab"
format.docstring-code-format = true
format.docstring-code-line-length = 40
lint.extend-select = ["UP", "RUF", "I"]
lint.ignore = ["RUF001", "RUF002", "RUF003"]
